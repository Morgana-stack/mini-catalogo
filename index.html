<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinePrime</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="container">
        <h1>CINEPRIME
            <a href="#">ELDORADO</a>
        </h1>
        <nav class="barra-de-navegação">
            <a href="#">PROGRAMAÇÃO</a>
            <a href="#">CINEMAS</a>
            <a href="#">SNACKBAR</a>
            <a href="#">CINEPRIME CLUB</a>
            <a href="#">PARA EMPRESAS</a>
            <a href="#">PARCERIAS</a>
            <a href="#">SUA SESSÃO</a>
            <a href="#">LOJA CINEPRIME</a>
        </nav>
    </header>
    <figure>
        <div class="carrossel">
            <input type="radio" name="slide" id="s1" checked>
            <input type="radio" name="slide" id="s2">
            <input type="radio" name="slide" id="s3">
            <input type="radio" name="slide" id="s4">
            <input type="radio" name="slide" id="s5">
            <div class="slides">
                <div class="slide">
                    <img src="imagens/a-propria-carne.png" alt="filme-propria-carne">
                </div>
                <div class="slide">
                    <img src="imagens/black.png" alt="propaganda-black-friday">
                </div>
                <div class="slide">
                    <img src="imagens/o-brevivente.png" alt="filme-o-sobrevivente">
                </div>
                <div class="slide">
                    <img src="imagens/truque-de-mestre.png" alt="filme-truque-de-mestre">
                </div>
                <div class="slide">
                    <img src="imagens/wicked.png" alt="filme-wicked">
                </div>
            </div>
            <div class="nav">
                <label for="s1"></label>
                <label for="s2"></label>
                <label for="s3"></label>
                <label for="s4"></label>
                <label for="s5"></label>
            </div>
        </div>
    </figure>
    <section>
        <div class="info-container">
            <div class="info1">
                <h3>Bradesco apresenta: <br>
                    Descontos inperdíveis.</h3>
            </div>
            <div class="info2">
                <p>Em cartaz: 50% de desconto no <br>
                    ingresso e no combo da pipoca+bebida.</p>
                <a href="#">consulte em banco.bradesco/cineprime</a>

            </div>
        </div>
    </section>
    <br>
    <figure class="container-dados">
        <h3>EM CARTAZ</h3>
        <div class="galeria">
            <div class="card">
                <img src="imagens/o-agente-secreto.png" alt="filme-o-agente-secreto">
                <div class="info-3">
                    <h4>O AGENTE SECRETO</h4>
                    <p class="categoria">Ação • 160m</p>
                    <span class="classificacao">16</span>
                </div>
            </div>
            <div class="card">
                <img src="imagens/terras-selvagens.png" alt="filme-terras-selvagens">
                <div class="info-3">
                    <h4>TERRAS SELVAGENS</h4>
                    <p class="categoria">Ação • 105m</p>
                    <span class="classificacao">16</span>
                </div>
            </div>
            <div class="card">
                <img src="imagens/wickd.png" alt="filme-wicked">
                <div class="info-3">
                    <h4>WICKED: PARTE II</h4>
                    <p class="categoria">Musical • 135m</p>
                    <span class="classificacao-1">10</span>
                </div>
            </div>
            <div class="card">
                <img src="imagens/truque-de-mestre-3.png" alt="filme-truque-de-mestre-3">
                <div class="info-3">
                    <h4>TRUQUE DE MESTRE - 3º ATO</h4>
                    <p class="categoria">Ação • 115m</p>
                    <span class="classificacao-2">12</span>
                </div>
            </div>
        </div>
    </figure>
    <figure class="container-dados2">
        <h3>EM BREVE</h3>
        <div class="galeria2">
            <div class="breve">
                <img src="imagens/zootopia.webp" alt="filme-zootopia2">
                <div class="info-4">
                    <h4>ZOOTOPIA 2</h4>
                    <p class="categoria-4">Animação • 110m</p>
                    <span class="classificacao-4">?</span>
                </div>
            </div>
            <div class="breve">
                <img src="imagens/five-nights.webp" alt="filme-five-nights-at">
                <div class="info-4">
                    <h4>FIVE NIGHTS AT FREDDYS 2</h4>
                    <p class="categoria-4">Terror • 105m</p>
                    <span class="classificacao-4">?</span>
                </div>
            </div>
            <div class="breve">
                <img src="imagens/quase-deserto.webp" alt="filme-quase-deserto">
                <div class="info-4">
                    <h4>QUASE DESERTO</h4>
                    <p class="categoria-4">Suspense • 110m</p>
                    <span class="classificacao-5">14</span>
                </div>
            </div>
            <div class="breve">
                <img src="imagens/DPA4.webp" alt="filme-detetives-do-predio-azul-4">
                <div class="info-4">
                    <h4>DETETIVES DO PRÉDIO AZUL 4:O <br>O FANTÁTISCO REINO DE ONDION</h4>
                    <p class="categoria-4">COMERDIA • 110m</p>
                    <span class="classificacao-4">?</span>
                </div>
            </div>
        </div>
    </figure>
</body>
<br><br><br><br><br><br>

</html>
