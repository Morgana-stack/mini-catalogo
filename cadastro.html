<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Roboto:ital,wght@0,100..900;1,100..900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap');

        body {
            background-color: #353434;
            color: #fff;
        }

        .container-cadastro {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;

            padding-top: 20px;
            border: 2px solid;

        }

        .icone-flexa img,
        .icone-x img {
            width: 35px;
        }

        .icone-flexa {
          justify-content:flex-start ;
        }

        .icone-x {
            justify-content: flex-end;
        }

       
    </style>
</head>

<body>
    <div class="container-cadastro">
        <div class="icone-flexa">
            <a href="index.html">
                <img src="imagens/icones/flexa-esquerda.png" alt="flexa-indicando-voltar">
            </a>
        </div>
        <div class="icone-x">
            <a href="index.html">
                <img src="imagens/icones/x-fechar.png" alt="x-fechar">
            </a>
        </div>
        <div class="cadastro-texto">
            <p>Cadastro</p>
        </div>

    </div>


</body>

</html>
